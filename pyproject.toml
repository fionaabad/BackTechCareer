[project]
name = "techcareer"
version = "0.1.0"
description = "TechCareer backend + ML models"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # ---------------- ML CORE ----------------
    "numpy>=1.26,<2.0",
    "pandas>=2.2,<2.3",
    "scikit-learn>=1.4,<1.8",
    "joblib>=1.3,<2.0",

    # ---------------- VISUAL + NOTEBOOKS ----------------
    "matplotlib>=3.8,<3.9",
    "seaborn>=0.13,<0.14",
    "jupyterlab>=4.0,<5.0",

    # ---------------- TENSORFLOW STACK ----------------
    "tensorflow==2.14.0",
    "tensorflow-hub==0.14.0",
    # IMPORTANTE: sin tensorflow-text en Windows
    # "tensorflow-text==2.14.0; sys_platform != 'win32'",

    # ---------------- PYTORCH STACK ----------------
    "torch>=2.2,<2.4",
    "transformers>=4.41,<4.43",

    # ---------------- FASTAPI + SERVER ----------------
    "fastapi>=0.110,<0.120",
    "uvicorn[standard]>=0.29,<0.30",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0,<2.0",

    # ---------------- PDF PROCESSING ----------------
    "pdfplumber>=0.11,<0.12",
    "Pillow>=10.0,<11.0",

    # ---------------- UTILITIES ----------------
    "requests>=2.31,<2.32",
]
